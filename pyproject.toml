[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
mypy_path = "/app"

[tool.pytest.ini_options]
pythonpath = ["/app"]
testpaths = ["tests"]
addopts = "--strict-markers"
